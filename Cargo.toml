# The LEZ multisig on LEZ v0.3.0's plan/apply ABI (run_program), with no SPEL: SPEL has
# no v0.3 support, and v0.3 replaced the stateful program ABI it generates code for.
# The SPEL-based crates (cli, idl-gen, lez-multisig-ffi, e2e_tests) stay in the tree for
# the v0.2.4 line and are out of this workspace until SPEL reaches v0.3.
[workspace]
resolver = "2"
members = [
    "multisig_core",
    "multisig_program",
    "methods",
    "methods/guest",
]
exclude = ["cli", "idl-gen", "lez-multisig-ffi", "e2e_tests"]

[workspace.dependencies]
risc0-zkvm = { version = "=3.0.5", features = ['std'] }
risc0-build = "=3.0.5"
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0", package = "lee_core" }
borsh = "1.5.7"
sha2 = "0.10.8"
